name: Code Style

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.documents/**'
      - 'documents/**'
      - 'SPEC.md'
      - 'LICENSE.md'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.documents/**'
      - 'documents/**'
      - 'SPEC.md'
      - 'LICENSE.md'
  workflow_dispatch:

jobs:
  pint:
    name: PHP Code Style (Laravel Pint)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none

      - name: Run Laravel Pint
        uses: aglipanci/laravel-pint-action@2.4
        with:
          preset: laravel
          testMode: true
